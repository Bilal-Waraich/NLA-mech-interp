[project]
name = "medinterp"
version = "0.1.0"
description = "Natural language autoencoders and sparse dictionary baselines for medical vision encoders"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "safetensors>=0.4",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medinterp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
